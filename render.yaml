# Render Blueprint — deploy the whole site (React build + FastAPI) as one
# Docker web service. In Render: New > Blueprint, point it at this repo.
services:
  - type: web
    name: wimm-website
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # URL to the hosted APK (e.g. a GitHub Release asset). The download
      # button redirects here because the APK is too big to commit.
      - key: WIMM_APK_URL
        sync: false
      - key: WIMM_APK_VERSION
        value: "2.0"
