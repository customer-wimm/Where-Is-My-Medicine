# Render Blueprint — deploy the whole site (React build + FastAPI) as one
# Docker web service. In Render: New > Blueprint, point it at this repo.
services:
  - type: web
    name: wimm-website
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Direct-download URL for the APK, hosted on Firebase Storage.
      # To ship a new version, upload it to Firebase and update this URL.
      - key: WIMM_APK_URL
        value: "https://firebasestorage.googleapis.com/v0/b/where-is-my-medicine-3aaaa.firebasestorage.app/o/application-for-website%2Fwimm.apk?alt=media&token=2814858f-0277-485c-9eb5-76db726a2193"
      - key: WIMM_APK_VERSION
        value: "2.0"
      # URL of the Admin/Super-Admin API (the wimm-admin-api service from the
      # other repo) — lets this site fetch the poster Super Admin publishes.
      # Leave unset to simply not show a poster. Baked in at build time.
      - key: VITE_ADMIN_API_URL
        sync: false
