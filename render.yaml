# Render Blueprint — deploy the whole site (React build + FastAPI) as one
# Docker web service. In Render: New > Blueprint, point it at this repo.
services:
  - type: web
    name: wimm-website
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Permanent "latest" link to the APK hosted on GitHub Releases.
      # Every release must attach an APK asset named exactly "wimm.apk" so this
      # URL always resolves to the newest build — no edits needed per version.
      - key: WIMM_APK_URL
        value: "https://github.com/customer-wimm/Where-Is-My-Medicine/releases/latest/download/wimm.apk"
      - key: WIMM_APK_VERSION
        value: "2.0"
      # URL of the Admin/Super-Admin API (the wimm-admin-api service from the
      # other repo) — lets this site fetch the poster Super Admin publishes.
      # Leave unset to simply not show a poster. Baked in at build time.
      - key: VITE_ADMIN_API_URL
        sync: false
